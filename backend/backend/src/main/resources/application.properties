spring.application.name=backend

server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true

# Runtime strategy: RULE_BASED or AI. The UI can switch it without restarting.
stockpulse.strategy=RULE_BASED

# LiteLLM gateway. Never commit the secret; set LLM_API_KEY in Render/local environment.
llm.endpoint=https://litellm-qc.zycus.net/v1/chat/completions
llm.api-key=${LLM_API_KEY:}
llm.model=qwen-cursor
llm.product-header=PC1
llm.cookie=${LLM_COOKIE:}

# Keep AI failures bounded so async work does not hang.
spring.mvc.async.request-timeout=5000
